server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # ── behind a reverse proxy (Dokploy / Coolify / Traefik terminates HTTPS) ──
    # never build absolute http://… URLs for redirects: the proxy is https, we are http,
    # and an absolute redirect would downgrade the scheme
    absolute_redirect off;
    # log the visitor's real address instead of the proxy's
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;   # default is "off" for proxied requests — we are always proxied in production
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css application/javascript image/svg+xml application/json application/manifest+json text/plain;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # hashed by Vite — a new build means new file names, so cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # self-hosted fonts (scripts/fetch-fonts.mjs) — never change in place
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # photos are listed at build time (virtual:photos) — no folder listings
    location /photos/ {
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # the service worker must always be fresh, or updates never reach her phone
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location = /registerSW.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # nginx's mime table doesn't know .webmanifest
    location = /manifest.webmanifest {
        types { }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # index.html and everything else — always revalidate (cheap: ETag → 304)
    location / {
        # link-preview crawlers need absolute URLs: fill in whatever domain we're served on
        sub_filter '__ORIGIN__' 'https://$host';
        sub_filter_once off;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # dotfiles are nobody's business
    location ~ /\. { return 404; }
}
