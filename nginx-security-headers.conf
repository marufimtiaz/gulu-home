# Shared by every location (nginx drops inherited add_header lines as soon as a
# location defines one of its own, so each location includes this file).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
# HTTPS is terminated by the proxy in front (Dokploy/Coolify/Traefik). Browsers ignore this
# header over plain http, so it is harmless on localhost.
add_header Strict-Transport-Security "max-age=31536000" always;
# Everything is self-hosted (fonts in /fonts, photos in /photos).
#   style-src 'unsafe-inline'       GSAP and the scenes write inline styles
#   data: / blob: (img, font, ...)  the reception card export draws to a canvas and saves a blob
#   worker-src / manifest-src       the offline service worker and the PWA manifest
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
